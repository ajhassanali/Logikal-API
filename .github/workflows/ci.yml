name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  build-backend:
    name: Build .NET Backend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Restore NuGet packages
        run: dotnet restore LogikalMiddleware.sln

      - name: Build solution
        run: dotnet build LogikalMiddleware.sln --configuration Release --no-restore

  build-dashboard:
    name: Build React Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/LogikalMiddleware.Dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/LogikalMiddleware.Dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Build
        run: npm run build
