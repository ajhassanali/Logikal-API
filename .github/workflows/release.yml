name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Create Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/LogikalMiddleware.Dashboard/package-lock.json

      # Build Dashboard into wwwroot
      - name: Install Dashboard dependencies
        working-directory: src/LogikalMiddleware.Dashboard
        run: npm ci

      - name: Build Dashboard
        working-directory: src/LogikalMiddleware.Dashboard
        run: npm run build

      # Publish .NET projects
      - name: Restore NuGet packages
        run: dotnet restore LogikalMiddleware.sln

      - name: Publish API
        run: dotnet publish src/LogikalMiddleware.Api/LogikalMiddleware.Api.csproj --configuration Release --output ./publish/api

      - name: Publish Windows Service
        run: dotnet publish src/LogikalMiddleware.Service/LogikalMiddleware.Service.csproj --configuration Release --output ./publish/service

      - name: Publish Bridge
        run: dotnet publish src/LogikalMiddleware.Bridge/LogikalMiddleware.Bridge.csproj --configuration Release --output ./publish/bridge

      # Create ZIP archives
      - name: Package API
        run: Compress-Archive -Path ./publish/api/* -DestinationPath ./LogikalMiddleware-API-${{ github.ref_name }}.zip

      - name: Package Service
        run: Compress-Archive -Path ./publish/service/* -DestinationPath ./LogikalMiddleware-Service-${{ github.ref_name }}.zip

      - name: Package Bridge
        run: Compress-Archive -Path ./publish/bridge/* -DestinationPath ./LogikalMiddleware-Bridge-${{ github.ref_name }}.zip

      # Create GitHub Release
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            LogikalMiddleware-API-${{ github.ref_name }}.zip
            LogikalMiddleware-Service-${{ github.ref_name }}.zip
            LogikalMiddleware-Bridge-${{ github.ref_name }}.zip
